[package]
name = "ets2-dashboard-editor"
version = "0.1.0"
edition = "2024"
authors = ["Metehan Bilal"]
description = "A modern dashboard editor for Euro Truck Simulator 2 and American Truck Simulator"
license = "MIT"
homepage = "https://metehanbilal.com"
keywords = ["ets2", "ats", "dashboard", "editor", "simulator"]
categories = ["graphics", "gui", "game-development"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ets2_dashboard_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = { version = "1", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["dds", "png"] }
memmap2 = "0.9"
tiny-skia = "0.11"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Full DXGI/BC coverage for game DDS; `image` DDS alone misses BC7 etc.
dds = { version = "0.2", default-features = false }
base64 = "0.22"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

